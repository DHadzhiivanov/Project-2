<!DOCTYPE html>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<title>{% block title %}{% endblock %} - SecurePad</title>

<nav>
    <h1><a href="{{url_for('blog.home')}}"> SecurePad </a></h1>
    <ul>
        {% if g.user %}
        <li>
            <div class="dropdown">
                <button class="dropbtn"><span>{{ g.user['username'] }}</span></button>
                <div class="dropdown-content">
                    <a href="{{ url_for('blog.posts') }}">Notes</a>
                    <a href="{{ url_for('auth.logout') }}" id="logout">Log Out</a>
                    <a href="#" id="disable">Disable Account</a>
                </div>
            </div>
            {% else %}
        <li><a href="{{ url_for('auth.register') }}">Register</a>
        <li><a href="{{ url_for('auth.login') }}">Log In</a>
            {% endif %}

    </ul>
</nav>
<section class="content">
    <header>
        {% block header %}{% endblock %}
    </header>
    {% for message in get_flashed_messages() %}
    <div class="flash">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</section>
